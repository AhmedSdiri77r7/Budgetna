# =========================
# ? SERVER CONFIGURATION
# =========================
server.port=8081

# =========================
# ? DATABASE CONFIGURATION (Azure MySQL)
# =========================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://budgetdb-srv-ahmed.mysql.database.azure.com:3306/flexibleserverdb?useSSL=true&requireSSL=true&serverTimezone=UTC
spring.datasource.username=ahmedadmin@budgetdb-srv-ahmed
spring.datasource.password=Fathia!222

# =========================
# ?? JPA / HIBERNATE
# =========================
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# =========================
# ? LOGGING
# =========================
logging.level.com.zaxxer.hikari=warn
logging.level.org.springframework=warn 
logging.level.root=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %-5level - %logger{60} - %msg%n

# =========================
# ? JWT SECURITY
# =========================
bezkoder.app.jwtSecret=bezKoderSecretKey
bezkoder.app.jwtExpirationMs=86400000
