name: Build & Deploy Budgetna Fullstack

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Minimal explicit permissions for actions that need them
permissions:
  contents: read
  id-token: write

jobs:
  # ----------------------------
  # Build Backend (Spring Boot)
  # ----------------------------
  backend-build:
    name: Build Spring Boot Backend
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v3

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: 🧩 Build Spring Boot
        working-directory: ./budget-backend-ahmed
        run: mvn clean package -DskipTests

      - name: 📤 Upload backend artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: ./budget-backend-ahmed/target/*.jar
          retention-days: 7

  # ----------------------------
  # Build Frontend (Angular)
  # ----------------------------
  frontend-build:
    name: Build Angular Frontend
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v3

      - name: 🧩 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ngx-admin/package-lock.json

      - name: ⚡ Install Angular dependencies
        working-directory: ./ngx-admin
        run: npm install --legacy-peer-deps

      - name: 🛠️ Build Angular
        working-directory: ./ngx-admin
        run: npx ng build --configuration production --aot

      - name: 📤 Upload frontend artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ./ngx-admin/dist/ngx-admin
          retention-days: 7

  # ----------------------------
  # Deploy Backend to Azure
  # ----------------------------
  backend-deploy:
    name: Deploy Spring Boot Backend
    runs-on: ubuntu-latest
    needs: backend-build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v3

      - name: ⬇️ Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend-artifact

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🚀 Deploy to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: budget-backend-ahmed
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: ./backend-artifact/*.jar

  # ----------------------------
  # Deploy Frontend to Azure Static Web App
  # ----------------------------
  frontend-deploy:
    name: Deploy Angular Frontend
    runs-on: ubuntu-latest
    needs: frontend-build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v3

      - name: ⬇️ Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-artifact

      - name: 🚀 Deploy to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEBAPP_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "ngx-admin"
          # The build artifact was uploaded from ./ngx-admin/dist/ngx-admin, so the downloaded artifact root contains ngx-admin
          output_location: "frontend-artifact/ngx-admin"
