name: Deploy Budgetna Fullstack

on:
  push:
    branches:
      - main

jobs:
  backend:
    name: Deploy Spring Boot Backend
    runs-on: ubuntu-latest

    steps:
      - name: 🔹 Checkout repository
        uses: actions/checkout@v3

      - name: ☕ Set up Java 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: 🧩 Build Spring Boot
        working-directory: ./bpd
        run: mvn clean package -DskipTests

      - name: 🚀 Deploy to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: budget-backend-ahmed
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: ./bpd/target/BPDBackEnd-1.0.jar

  frontend:
    name: Deploy Angular Frontend
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - name: 🔹 Checkout repository
        uses: actions/checkout@v3

      - name: 🧩 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: ⚡ Install Angular dependencies
        working-directory: ./ngx-admin
        run: npm install

      - name: 🛠️ Build Angular
        working-directory: ./ngx-admin
        run: npm run build -- --prod

      - name: 🚀 Deploy to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEBAPP_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "ngx-admin"
          output_location: "ngx-admin/dist"
