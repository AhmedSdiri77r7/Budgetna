name: Deploy Budgetna Project to Azure

on:
  push:
    branches:
      - main

jobs:
  backend-deploy:
    name: Deploy Spring Boot Backend
    runs-on: ubuntu-latest

    steps:
      - name: 🔹 Checkout repository
        uses: actions/checkout@v3

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🧩 Build with Maven
        working-directory: ./bpd
        run: mvn clean package -DskipTests

      - name: 🔍 List target files
        run: ls -R ./bpd/target

      - name: 🚀 Deploy to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: budget-backend-ahmed
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: ./bpd/target/BPDBackEnd-1.0.jar

  frontend-deploy:
    name: Deploy Angular Frontend
    runs-on: ubuntu-latest
    needs: backend-deploy

    steps:
      - name: 🔹 Checkout repository
        uses: actions/checkout@v3

      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: 📦 Install dependencies
        working-directory: ./ngx-admin
        run: npm ci

      - name: 🛠️ Build Angular project
        working-directory: ./ngx-admin
        run: npm run build -- --prod

      - name: 🚀 Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEBAPP_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "ngx-admin"
          output_location: "ngx-admin/dist"
