name: Lint PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16.x'
          cache: 'npm'

      - name: Install dependencies
        working-directory: ./ngx-admin
        run: npm ci

      - name: Run ESLint
        working-directory: ./ngx-admin
        run: npm run lint
        continue-on-error: true
