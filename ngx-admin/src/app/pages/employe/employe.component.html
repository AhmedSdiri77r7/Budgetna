<div class="row">
  <div class="col-md-4 mb-4" *ngFor="let emp of listemploye">
    <nb-card>
      <nb-card-header class="d-flex justify-content-between align-items-center">
        <div>{{ emp.nom }} {{ emp.prenom }}</div>
        <div class="header-buttons">
          <button nbButton size="tiny" status="primary">
            <i class="material-icons">edit</i>
          </button>
          <button nbButton size="tiny" status="danger">
            <i class="material-icons">delete</i>
          </button>
        </div>
      </nb-card-header>

      <nb-card-body class="text-center">
        <!-- Prévisualisation locale -->
        <img *ngIf="previewUrls[emp.id]; else existingImage" [src]="previewUrls[emp.id]" class="employee-avatar mb-2" />

        <!-- Image existante depuis Spring Boot (accepte image ou imageUrl) -->
        <ng-template #existingImage>
          <img *ngIf="emp.image || emp.imageUrl; else noImage" [src]="getImageUrl(emp)" class="employee-avatar mb-2" />
        </ng-template>

        <!-- Avatar par défaut si aucune image -->
        <ng-template #noImage>
          <img src="assets/default-avatar.png" class="employee-avatar mb-2" />
        </ng-template>

        <p class="mb-1"><strong>Role:</strong> {{ emp.role }}</p>
        <p class="mb-2"><strong>Email:</strong> {{ emp.email }}</p>

        <input type="file" (change)="onFileSelected($event, emp.id)" accept="image/*" />
        <button nbButton size="tiny" status="success" *ngIf="selectedFiles[emp.id]" (click)="uploadImage(emp.id)">
          Upload
        </button>
      </nb-card-body>
    </nb-card>
  </div>
</div>
